<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">SUPER ADC — 本地团队的广告营销智能体</title>
  <desc id="desc">项目名称与定位说明，右侧为应用程序图标：深蓝圆角方块上的白色 ADC 字样。</desc>

  <rect width="1200" height="400" rx="26" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="25.25" fill="none" stroke="#E8EAF2" stroke-width="1.5"/>

  <g id="title-block" transform="translate(72 0)">
    <rect x="0" y="96" width="12" height="12" rx="3" fill="#000884"/>
    <text x="24" y="107" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="3" fill="#8A8F9E">LOCAL-FIRST · PRIVATE DEPLOYMENT</text>
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="72" font-weight="700" letter-spacing="2" fill="#16181D">SUPER <tspan fill="#000884">ADC</tspan></text>
    <text x="0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="26" fill="#16181D">本地团队的广告营销智能体</text>
    <text x="0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="19" fill="#5F6572">内容生产、媒体素材、跨平台协作与定时自动化，都跑在你自己的机器上</text>
    <text x="0" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#8A8F9E">WINDOWS · AUTO-UPDATE · APACHE-2.0</text>
  </g>

  <!-- 应用程序图标：深蓝圆角方块 + 白色 ADC -->
  <g id="app-icon" transform="translate(880 92)">
    <rect width="216" height="216" rx="52" fill="#000884"/>
    <text x="108" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="88" font-weight="800" font-style="italic" letter-spacing="2" fill="#FFFFFF">ADC</text>
  </g>
</svg>
